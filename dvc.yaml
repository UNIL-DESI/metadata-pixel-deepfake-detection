stages:
  
  dvc-code-analysis:
    cmd: bash .dvc-viewer/bootstrap.sh && dvc-viewer hash
    always_changed: true
    outs:
    - .dvc-viewer/hashes: {cache: false}
  
  prepare_dataset:
    # Downloads Deepfakes.zip with huggingface_hub (HF_TOKEN from the repo
    # secrets if the dataset is private) and unpacks FF++, Celeb-DF and DFDC.
    cmd: python scripts/prepare_dataset_hf.py
    deps: [scripts/prepare_dataset_hf.py, .dvc-viewer/hashes/prepare_dataset.hash]
    outs: [data/raw/Hybrid_Deepfake_Dataset]
  
  catalog:
    cmd: echo "force-fix" && python scripts/run_create_catalog.py --config config/full.yaml
    deps: [scripts/run_create_catalog.py, config/full.yaml, data/raw/Hybrid_Deepfake_Dataset,
      .dvc-viewer/hashes/catalog.hash]
    metrics:
    - dataset_inventory.csv: {cache: false}
  
  extract_frames:
    cmd: python scripts/run_extract_frames.py --config config/full.yaml
    deps: [scripts/run_extract_frames.py, config/full.yaml, dataset_inventory.csv,
      .dvc-viewer/hashes/extract_frames.hash]
    outs: [data/ExtractedFrames/]
  
  extract_regions:
    cmd: python scripts/run_extract_multi_regions.py --config config/full.yaml
    deps: [scripts/run_extract_multi_regions.py, config/full.yaml, data/ExtractedFrames/,
      .dvc-viewer/hashes/extract_regions.hash]
    outs: [data/MultiRegionFrames/]
  
  extract_handcrafted:
    cmd: python scripts/run_extract_handcrafted_features.py --config config/full.yaml
    deps: [scripts/run_extract_handcrafted_features.py, config/full.yaml, data/MultiRegionFrames/,
      .dvc-viewer/hashes/extract_handcrafted.hash]
    outs: [features/handcrafted/handcrafted_frame_features.csv]
  
  aggregate_handcrafted:
    cmd: python scripts/run_aggregate_handcrafted_features.py --config config/full.yaml
    deps: [scripts/run_aggregate_handcrafted_features.py, config/full.yaml, features/handcrafted/handcrafted_frame_features.csv,
      .dvc-viewer/hashes/aggregate_handcrafted.hash]
    outs: [features/handcrafted/handcrafted_video_features.csv]
  
  extract_cnn:
    cmd: python scripts/run_extract_cnn_features.py --config config/full.yaml
    deps: [scripts/run_extract_cnn_features.py, config/full.yaml, data/MultiRegionFrames/,
      .dvc-viewer/hashes/extract_cnn.hash]
    outs: [features/CNNFeatures/mobilenetv2_frame_features.csv]
  
  aggregate_cnn:
    cmd: python scripts/run_aggregate_cnn_features.py --config config/full.yaml
    deps: [scripts/run_aggregate_cnn_features.py, config/full.yaml, features/CNNFeatures/mobilenetv2_frame_features.csv,
      .dvc-viewer/hashes/aggregate_cnn.hash]
    outs: [features/CNNFeatures/mobilenetv2_video_features.csv]
  
  extract_metadata:
    cmd: python scripts/run_extract_metadata.py --config config/full.yaml
    always_changed: true
    deps: [scripts/run_extract_metadata.py, config/full.yaml, dataset_inventory.csv,
      .dvc-viewer/hashes/extract_metadata.hash]
    outs: [features/metadata/raw_metadata_features.csv]
  
  analyze_metadata:
    cmd: python scripts/analyze_metadata.py --config config/full.yaml
    always_changed: true
    deps: [scripts/analyze_metadata.py, config/full.yaml, features/metadata/raw_metadata_features.csv,
      .dvc-viewer/hashes/analyze_metadata.hash]
    metrics:
    - reports/metadata_analysis.json: {cache: false}
  
  preprocess_metadata:
    cmd: python scripts/preprocess_metadata.py --config config/full.yaml
    always_changed: true
    deps: [scripts/preprocess_metadata.py, config/full.yaml, features/metadata/raw_metadata_features.csv,
      data/splits/, .dvc-viewer/hashes/preprocess_metadata.hash]
    outs: [features/metadata/metadata_preprocessed]
  
  align_features:
    cmd: python scripts/run_align_features.py --config config/full.yaml
    always_changed: true
    deps: [scripts/run_align_features.py, config/full.yaml, features/handcrafted/handcrafted_video_features.csv,
      features/CNNFeatures/mobilenetv2_video_features.csv, features/metadata/metadata_preprocessed,
      dataset_inventory.csv, .dvc-viewer/hashes/align_features.hash]
    outs: [features/aligned]
  
  feature_analysis:
    cmd: python scripts/run_feature_analysis.py --config config/full.yaml
    always_changed: true
    deps: [scripts/run_feature_analysis.py, config/full.yaml, features/aligned/aligned_all_features.csv,
      .dvc-viewer/hashes/feature_analysis.hash]
    outs: [features/analysis]
  
  split_dataset:
    cmd: python scripts/run_split_dataset.py --config config/full.yaml
    deps: [scripts/run_split_dataset.py, config/full.yaml, dataset_inventory.csv,
      .dvc-viewer/hashes/split_dataset.hash]
    outs: [data/splits/]
  
  feature_selection:
    cmd: python scripts/run_feature_selection.py --config config/full.yaml
    always_changed: true
    deps: [scripts/run_feature_selection.py, config/full.yaml, data/splits/, .dvc-viewer/hashes/feature_selection.hash]
    outs: [features/selected]
  
  train_models:
    cmd: python scripts/run_train_models.py --config config/full.yaml
    deps: [scripts/run_train_models.py, config/full.yaml, features/selected, data/splits/,
      .dvc-viewer/hashes/train_models.hash]
    outs: [models/]
    metrics:
    - results/full/best_model_validation.json: {cache: false}
  
  final_evaluation:
    cmd: python scripts/run_final_evaluation.py --config config/full.yaml
    deps: [scripts/run_final_evaluation.py, scripts/run_train_models.py, config/full.yaml,
      models/, features/selected, results/full/best_model_validation.json,
      .dvc-viewer/hashes/final_evaluation.hash]
    outs: [models_final/]
    metrics:
    - results/full/final_test_metrics.json: {cache: false}
  
  ablation_study:
    cmd: python scripts/run_ablation_study.py --config config/full.yaml
    deps: [scripts/run_ablation_study.py, config/full.yaml, features/aligned/aligned_all_features.csv,
      .dvc-viewer/hashes/ablation_study.hash]
    plots:
    - results/full/ablation: {cache: false}
  
  predict_dataset_origin:
    cmd: mkdir -p results && python scripts/run_dataset_origin_test.py > results/dataset_origin_report.txt
    deps: [scripts/run_dataset_origin_test.py, features/aligned/aligned_metadata.csv,
      dataset_inventory.csv, .dvc-viewer/hashes/predict_dataset_origin.hash]
    metrics:
    - results/dataset_origin_report.txt: {cache: false}
  
  cross_dataset_metadata:
    cmd: python scripts/run_cross_dataset_metadata.py
    deps: [scripts/run_cross_dataset_metadata.py, features/aligned/aligned_metadata.csv,
      dataset_inventory.csv, .dvc-viewer/hashes/cross_dataset_metadata.hash]
    metrics:
    - results/cross_dataset_metadata_results.csv: {cache: false}
  
  metadata_bias_screening:
    cmd: mkdir -p results && python scripts/run_metadata_bias_screening.py
    deps: [scripts/run_metadata_bias_screening.py, features/aligned/aligned_metadata.csv,
      dataset_inventory.csv, .dvc-viewer/hashes/metadata_bias_screening.hash]
    metrics:
    - results/metadata_bias_screening.csv: {cache: false}
  
  metadata_within_dataset_analysis:
    cmd: python scripts/run_metadata_within_dataset_analysis.py
    deps: [scripts/run_metadata_within_dataset_analysis.py, features/aligned/aligned_metadata.csv,
      dataset_inventory.csv, .dvc-viewer/hashes/metadata_within_dataset_analysis.hash]
    metrics:
    - results/metadata_within_dataset_analysis.csv: {cache: false}
    - results/metadata_within_dataset_summary.csv: {cache: false}

  hybrid_hybrid_001:
    cmd: python -u scripts/run_hybrid_experiment.py --config config/experiments/hybrid_001.yaml --resume
    deps:
    - config/experiments/hybrid_001.yaml
    - scripts/run_hybrid_experiment.py
    - scripts/run_hybrid_metadata.py
    - scripts/preprocess_metadata.py
    - src/preprocessing
    - src/features
    - src/metadata
    - data/raw/Hybrid_Deepfake_Dataset
    outs:
    # persist: DVC keeps the folder between runs, so --resume can reuse
    # the videos an interrupted run already processed.
    - experiments/hybrid_001/artifacts:
        persist: true
    metrics:
    - results/hybrid_001/metrics.json:
        cache: false
    - results/hybrid_001/run_status.json:
        cache: false
    plots:
    - results/hybrid_001/comparison.csv:
        cache: false

  hybrid_hybrid_pilot_001:
    cmd: python -u scripts/run_hybrid_experiment.py --config config/experiments/hybrid_pilot_001.yaml --resume
    deps:
    - config/experiments/hybrid_pilot_001.yaml
    - scripts/run_hybrid_experiment.py
    - scripts/run_hybrid_metadata.py
    - scripts/preprocess_metadata.py
    - src/preprocessing
    - src/features
    - src/metadata
    - data/raw/Hybrid_Deepfake_Dataset
    outs:
    # persist: DVC keeps the folder between runs, so --resume can reuse
    # the videos an interrupted run already processed.
    - experiments/hybrid_pilot_001/artifacts:
        persist: true
    metrics:
    - results/hybrid_pilot_001/metrics.json:
        cache: false
    - results/hybrid_pilot_001/run_status.json:
        cache: false
    plots:
    - results/hybrid_pilot_001/comparison.csv:
        cache: false

  gpu_smoke_test:
    cmd: python -u scripts/check_gpu.py
    deps:
      - scripts/check_gpu.py
      - src/features/cnn_models.py
    metrics:
      - results/gpu_check/status.json:
          cache: false
    outs:
      - results/gpu_check/diagnostics.log:
          cache: false