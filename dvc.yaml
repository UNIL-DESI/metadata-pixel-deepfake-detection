stages:
  dvc-code-analysis:
    cmd: bash .dvc-viewer/bootstrap.sh && dvc-viewer hash
    always_changed: true
    outs:
    - .dvc-viewer/hashes: {cache: false}  
      
  prepare_dataset:
    cmd: >-
      curl -L "https://huggingface.co/datasets/dinithiKP/Deepfakes/resolve/main/Deepfakes.zip" -o Deepfakes.zip &&
      mkdir -p data/raw/Hybrid_Deepfake_Dataset &&
      unzip -q -o Deepfakes.zip -d data/raw/Hybrid_Deepfake_Dataset &&
      rm Deepfakes.zip
    outs:
      - data/raw/Hybrid_Deepfake_Dataset
      
  catalog:
    cmd: python scripts/run_create_catalog.py --config full.yaml
    deps: [scripts/run_create_catalog.py, full.yaml, .dvc-viewer/hashes/catalog.hash]
    outs: [dataset_inventory.csv]
    
  extract_frames:
    cmd: python scripts/run_extract_frames.py --config full.yaml
    deps: [scripts/run_extract_frames.py, full.yaml, dataset_inventory.csv, .dvc-viewer/hashes/extract_frames.hash]
    outs: [data/ExtractedFrames/]
    
  extract_regions:
    cmd: python scripts/run_extract_multi_regions.py --config full.yaml
    deps: [scripts/run_extract_multi_regions.py, full.yaml, data/ExtractedFrames/, .dvc-viewer/hashes/extract_regions.hash]
    outs: [data/MultiRegionFrames/]
    
  extract_handcrafted:
    cmd: python scripts/run_extract_handcrafted_features.py --config full.yaml
    deps: [scripts/run_extract_handcrafted_features.py, full.yaml, data/MultiRegionFrames/, .dvc-viewer/hashes/extract_handcrafted.hash]
    outs: [features/handcrafted/handcrafted_frame_features.csv]
    
  aggregate_handcrafted:
    cmd: python scripts/run_aggregate_handcrafted_features.py --config full.yaml
    deps: [scripts/run_aggregate_handcrafted_features.py, full.yaml, features/handcrafted/handcrafted_frame_features.csv, .dvc-viewer/hashes/aggregate_handcrafted.hash]
    outs: [features/handcrafted/handcrafted_video_features.csv]
    
  extract_cnn:
    cmd: python scripts/run_extract_cnn_features.py --config full.yaml
    deps: [scripts/run_extract_cnn_features.py, full.yaml, data/MultiRegionFrames/, .dvc-viewer/hashes/extract_cnn.hash]
    outs: [features/CNNFeatures/mobilenetv2_frame_features.csv]
    
  aggregate_cnn:
    cmd: python scripts/run_aggregate_cnn_features.py --config full.yaml
    deps: [scripts/run_aggregate_cnn_features.py, full.yaml, features/CNNFeatures/mobilenetv2_frame_features.csv, .dvc-viewer/hashes/aggregate_cnn.hash]
    outs: [features/CNNFeatures/mobilenetv2_video_features.csv]
    
  extract_metadata:
    cmd: python scripts/run_extract_metadata.py --config full.yaml
    deps: [scripts/run_extract_metadata.py, full.yaml, dataset_inventory.csv, .dvc-viewer/hashes/extract_metadata.hash]
    outs: [features/metadata/raw_metadata_features.csv]
    
  analyze_metadata:
    cmd: python scripts/analyze_metadata.py --config full.yaml
    deps: [scripts/analyze_metadata.py, full.yaml, features/metadata/raw_metadata_features.csv, .dvc-viewer/hashes/analyze_metadata.hash]
    metrics:
    - reports/metadata_analysis.json: {cache: false}
    
  preprocess_metadata:
    cmd: python scripts/preprocess_metadata.py --config full.yaml
    deps: [scripts/preprocess_metadata.py, full.yaml, features/metadata/raw_metadata_features.csv, .dvc-viewer/hashes/preprocess_metadata.hash]
    outs: [features/metadata/metadata_features.csv]
    
  align_features:
    cmd: python scripts/run_align_features.py --config full.yaml
    deps: 
      - scripts/run_align_features.py
      - full.yaml
      - features/handcrafted/handcrafted_video_features.csv
      - features/CNNFeatures/mobilenetv2_video_features.csv
      - features/metadata/metadata_features.csv
      - .dvc-viewer/hashes/align_features.hash
    outs: [features/aligned/aligned_features.csv]
    
  feature_analysis:
    cmd: python scripts/run_feature_analysis.py --config full.yaml
    deps: [scripts/run_feature_analysis.py, full.yaml, features/aligned/aligned_features.csv, .dvc-viewer/hashes/feature_analysis.hash]
    plots:
    - reports/feature_correlation.png: {cache: false}
    
  split_dataset:
    cmd: python scripts/run_split_dataset.py --config full.yaml
    deps: [scripts/run_split_dataset.py, full.yaml, features/aligned/aligned_features.csv, .dvc-viewer/hashes/split_dataset.hash]
    outs: [data/splits/]
    
  feature_selection:
    cmd: python scripts/run_feature_selection.py --config full.yaml
    deps: [scripts/run_feature_selection.py, full.yaml, data/splits/, .dvc-viewer/hashes/feature_selection.hash]
    outs: [features/selected_features.pkl]
    
  train_models:
    cmd: python scripts/run_train_models.py --config full.yaml
    deps: [scripts/run_train_models.py, full.yaml, features/selected_features.pkl, data/splits/, .dvc-viewer/hashes/train_models.hash]
    outs: [models/]
    metrics:
    - reports/training_metrics.json: {cache: false}
    
  final_evaluation:
    cmd: python scripts/run_final_evaluation.py --config full.yaml
    deps: [scripts/run_final_evaluation.py, full.yaml, models/, data/splits/, .dvc-viewer/hashes/final_evaluation.hash]
    metrics:
    - reports/final_eval.json: {cache: false}
    plots:
    - reports/confusion_matrix.png: {cache: false}
    - reports/roc_curve.png: {cache: false}
    
  ablation_study:
    cmd: python scripts/run_ablation_study.py --config full.yaml
    deps: [scripts/run_ablation_study.py, full.yaml, features/aligned/aligned_features.csv, data/splits/, .dvc-viewer/hashes/ablation_study.hash]
    metrics:
    - reports/ablation_results.json: {cache: false}